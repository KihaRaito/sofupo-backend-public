version: "3"

services:
  db:
    container_name: db
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.db
    image: db:v1.0.0
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 5432:5432
  e2e:
    container_name: e2e
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.e2e
    image: e2e:v1.0.0
    environment:
      DB_DRIVER: postgres
      DB_HOST: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - 8080:8080
    depends_on:
      - db
